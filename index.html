<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peça sua música - Jackie Ferreira</title>

    <!-- Meta tags para preview em redes sociais -->
    <meta property="og:title" content="Peça sua música - Jackie Ferreira 🎵">
    <meta property="og:description" content="Siga Jackie Ferreira no Instagram e peça sua música favorita para a festa!">
    <meta property="og:image" content="./sbt.png">
    <meta property="og:url" content="">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Peça sua música - Jackie Ferreira 🎵">
    <meta name="twitter:description" content="Siga Jackie Ferreira no Instagram e peça sua música favorita para a festa!">
    <meta name="twitter:image" content="./sbt.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --accent-pink: #ff006e;
            --accent-cyan: #00d9ff;
            --accent-purple: #a100f2;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --border-color: #ff006e;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Efeito de fundo cyberpunk */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 110, 0.03) 0px,
                    rgba(255, 0, 110, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                ),
                radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.98;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-section {
            margin-bottom: 50px;
            animation: slideInCyberpunk 0.8s ease-out;
        }

        @keyframes slideInCyberpunk {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .profile-image {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            border-radius: 50%;
            border: 4px solid var(--accent-cyan);
            position: relative;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 217, 255, 0.8),
                0 0 80px rgba(0, 217, 255, 0.4),
                inset 0 0 40px rgba(0, 217, 255, 0.2),
                0 20px 50px rgba(255, 0, 110, 0.4);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) saturate(0.9);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 217, 255, 0.5);
            animation: scan 8s linear infinite;
            border-radius: 50%;
        }

        @keyframes scan {
            0% {
                top: 0%;
            }
            100% {
                top: 100%;
            }
        }

        .dj-name {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow:
                0 0 15px rgba(0, 217, 255, 0.9),
                0 0 30px rgba(255, 0, 110, 0.6),
                -3px -3px 0 rgba(255, 0, 110, 0.8);
            position: relative;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow:
                    0 0 15px rgba(0, 217, 255, 0.9),
                    0 0 30px rgba(255, 0, 110, 0.6),
                    -3px -3px 0 rgba(255, 0, 110, 0.8);
            }
            50% {
                text-shadow:
                    0 0 20px rgba(0, 217, 255, 1),
                    0 0 40px rgba(255, 0, 110, 0.8),
                    3px 3px 0 rgba(161, 0, 242, 0.9);
            }
        }

        .dj-role {
            font-size: 12px;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 0, 110, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dj-role::before,
        .dj-role::after {
            content: '◆';
            font-size: 10px;
        }

        .message {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-primary);
            margin: 30px 0 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 0, 110, 0.05));
            border-left: 5px solid var(--accent-cyan);
            border-right: 5px solid var(--accent-pink);
            border-radius: 10px;
            box-shadow:
                0 0 30px rgba(0, 217, 255, 0.3),
                inset 0 0 20px rgba(0, 217, 255, 0.1);
            position: relative;
        }

        .message::before {
            content: '⬥ ';
            color: var(--accent-cyan);
            font-weight: 900;
            font-size: 20px;
        }

        .message .highlight {
            color: var(--accent-pink);
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 0, 110, 0.9);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            transform-origin: center;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), #ff3d82);
            color: var(--text-primary);
            box-shadow:
                0 8px 25px rgba(255, 0, 110, 0.4),
                0 0 20px rgba(255, 0, 110, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-6px);
            box-shadow:
                0 15px 40px rgba(255, 0, 110, 0.6),
                0 0 30px rgba(255, 0, 110, 0.5),
                0 0 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(-2px);
            box-shadow:
                0 5px 20px rgba(255, 0, 110, 0.4),
                0 0 15px rgba(255, 0, 110, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(0, 217, 255, 0.1));
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            box-shadow:
                0 8px 25px rgba(0, 217, 255, 0.3),
                0 0 15px rgba(0, 217, 255, 0.2),
                inset 0 0 20px rgba(0, 217, 255, 0.08);
        }

        .btn-secondary:hover {
            transform: translateY(-6px);
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.3), rgba(0, 217, 255, 0.15));
            box-shadow:
                0 15px 40px rgba(0, 217, 255, 0.5),
                0 0 30px rgba(0, 217, 255, 0.4),
                inset 0 0 20px rgba(0, 217, 255, 0.15);
            border-color: rgba(0, 217, 255, 1);
        }

        .btn-secondary:active {
            transform: translateY(-2px);
            box-shadow:
                0 5px 20px rgba(0, 217, 255, 0.3),
                0 0 15px rgba(0, 217, 255, 0.2);
        }

        .music-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 20px;
            animation: pulse-icon 1.5s infinite;
        }

        @keyframes pulse-icon {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 5px currentColor;
            }
            50% {
                transform: scale(1.2);
                text-shadow: 0 0 15px currentColor;
            }
        }

        .footer-note {
            margin-top: 60px;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .profile-image {
                width: 160px;
                height: 160px;
                margin: 0 auto 30px;
            }

            .dj-name {
                font-size: 32px;
                letter-spacing: 2px;
            }

            .message {
                font-size: 16px;
                padding: 20px;
                margin: 20px 0 40px;
            }

            .btn {
                padding: 14px 32px;
                font-size: 13px;
                letter-spacing: 1px;
                border-radius: 12px;
            }

            body {
                padding: 15px;
            }

            .container {
                max-width: 100%;
            }

            .button-group {
                gap: 15px;
            }
        }

        @media (max-width: 320px) {
            .profile-image {
                width: 130px;
                height: 130px;
                margin: 0 auto 20px;
            }

            .dj-name {
                font-size: 26px;
                letter-spacing: 1px;
            }

            .message {
                font-size: 14px;
                padding: 15px;
                margin: 15px 0 30px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 12px;
                border-radius: 10px;
            }
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #000000;
                --bg-secondary: #0a0a0a;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #0f0f0f;
                --bg-secondary: #1a1a1a;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <div class="profile-image">
                <div class="scan-line"></div>
                <img id="profileImg" src="https://scontent.cdninstagram.com/v/t51.82787-19/753535072_18438623776192336_6385659611037142840_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=1&ccb=7-5&_nc_sid=f7ccc5&_nc_ohc=eCmnGj9TPFIQ7kNvgHJjVLa&_nc_oc=Adi3_vxq1vE3LvAy_aQ9Jq_LYX4QiVCKXt3PCR6H8YmCPVyLmJnP&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=AWEpn69kfoi11emrMk_Ngg&oh=00_AQE3Zs4N5ZY7LhJqL0ZfZ0zpaRMZvuqrB6d-itQa9GYt068H0Pg&oe=6A8540F2" alt="Jackie" onerror="this.src='./sbt.png'">
            </div>

            <div class="dj-name">Carregando...</div>
            <div class="dj-role">Carregando...</div>
        </div>

        <p class="message">
            Antes de pedir sua música, <span class="highlight">siga quem está patrocinando sua festa hoje</span>
        </p>

        <div class="button-group">
            <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Seguir no Instagram
            </a>

            <button class="btn btn-secondary" onclick="handleMusicRequest()">
                <span class="music-icon">♪</span> Peça sua música aqui
            </button>
        </div>

        <div class="footer-note">
            ▓ Conectado ao sistema de festa ▓
        </div>
    </div>

    <script>
        // Carregar configurações dinamicamente
        async function loadConfig() {
            try {
                const response = await fetch('./urls/config.json');
                const config = await response.json();

                // Atualizar nome
                document.querySelector('.dj-name').textContent = config.name;

                // Atualizar role
                document.querySelector('.dj-role').textContent = config.role;

                // Atualizar link do Instagram
                document.querySelector('.btn-primary').href = config.instagram_url;

                // Extrair username do Instagram e buscar foto
                const instagramUrl = config.instagram_url;
                const usernameMatch = instagramUrl.match(/instagram\.com\/([^/?]+)/);

                if (usernameMatch) {
                    const username = usernameMatch[1];
                    loadInstagramProfilePic(username);
                }

                // Atualizar meta tags
                document.querySelector('meta[property="og:title"]').setAttribute('content', `Peça sua música - ${config.name} 🎵`);
                document.querySelector('meta[property="og:description"]').setAttribute('content', `Siga ${config.name} no Instagram e peça sua música favorita para a festa!`);
            } catch (error) {
                console.error('Erro ao carregar config.json:', error);
            }
        }

        // Buscar foto de perfil do Instagram
        async function loadInstagramProfilePic(username) {
            try {
                const response = await fetch(`https://www.instagram.com/${username}/?__a=1`, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0'
                    }
                }).catch(() => null);

                if (response && response.ok) {
                    const data = await response.json();
                    const profilePic = data.graphql?.user?.profile_pic_url_hd || data.user?.profile_pic_url_hd;

                    if (profilePic) {
                        document.getElementById('profileImg').src = profilePic;
                        return;
                    }
                }
            } catch (e) {
                console.log('Não conseguiu carregar foto do Instagram');
            }

            // Fallback para imagem local
            document.getElementById('profileImg').src = './sbt.png';
        }

        function handleMusicRequest() {
            alert('🎵 SISTEMA PRONTO\n\nSiga no Instagram primeiro e depois volte para pedir sua música!');
        }

        // Carregar configurações ao iniciar
        window.addEventListener('load', loadConfig);

        // Efeito de glitch aleatório
        setInterval(() => {
            if (Math.random() > 0.95) {
                const element = document.querySelector('.dj-name');
                element.style.transform = `skew(${Math.random() * 2 - 1}deg)`;
                setTimeout(() => {
                    element.style.transform = 'skew(0deg)';
                }, 50);
            }
        }, 500);
    </script>
</body>
</html>
